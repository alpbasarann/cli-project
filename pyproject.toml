[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cli-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "anthropic>=0.40",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
agent = "agent.cli.app:app"
agent-eval = "evals.runner:app"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "evals"]

[tool.pytest.ini_options]
pythonpath = ["src"]
