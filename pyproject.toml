[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cli-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0", "anthropic>=0.40"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]